# bonsai/pack.yaml: base's Bonsai manifest, format bonsai.pack/1. Base is Bonsai's own pack: the templates of Bonsai's
# documents (skills), the walls round the files that hold keys, tokens and logins, Bonsai's four labels
# (labels.yaml) and a short block (block.md). Bonsai's engine reads this file when a project links base (bonsai init,
# bonsai update) and when CI runs bonsai check --pack on it; Claude Code never reads it. Base carries no code: no hook
# line, no file the engine writes, nothing in the plugin that runs (packs/packs_test.go holds that). Every key carries
# its comment, at its line's end or on the line just above; bonsai check --pack fails a key without one. Every
# field's full meaning, type and allowed values: bonsai check --schema bonsai.pack. Text that does not start with a
# letter is quoted (format-1 YAML).
format: bonsai.pack/1                 # the format and its version, always the first key; only bonsai.pack/1
id: base                              # the pack's id, equal to "name" in .claude-plugin/plugin.json; skills load as base:<name>
# version: base's version, quoted, as X.Y.Z; its release tag is base- and this (base-v0.1.0), never a bare v tag, so
# Bonsai's own release never fires. plugin.json carries none: a project pins base by commit
version: "0.1.0"
needs:                                # what a machine needs for base; bonsai status --json lists each
  claude_code: "2.1.294"              # the oldest Claude Code base works with, quoted: Bonsai's own floor
block: block.md                       # base's part of the block in a project's CLAUDE.md: bonsai/block.md, a few lines
files: []                             # files the engine writes into a project: none (base's templates are skills)
hooks: []                             # hook lines the engine writes into .claude/settings.json: none (base runs no code)
# deny: the walls, the deny rules the engine writes into every linked project's .claude/settings.json, each with its
# why, the sentence bonsai update's preview prints (this list is their one home; README.md says what they are for and
# what they leave out). What is walled, one rule for all: Read, the files and folders that commonly hold keys, tokens
# or logins; Edit, the person's own Claude Code files and the files whose change starts code (an Edit rule also stops
# Write and a shell redirect). An exact file where one is enough, a folder (a recursive glob) only where a tool keeps
# several. Each wall has its twins: ~/ is the session's own home (on Windows the Windows home); //mnt/c/Users/*/ is the
# Windows home seen from WSL; //wsl.localhost/*/home/*/ and //wsl$/*/home/*/ are WSL's home seen from Windows. A twin
# is left out only where no common program keeps that file in that home, as each group's comment says. Bonsai's own
# rules (.bonsai/local/, the two tables, ~/.bonsai/) are the engine's, never repeated here. Each entry:
#   rule: a Claude Code permission rule, quoted: Read(<path>) or Edit(<path>), the path from ~/ (the home) or //
#         (the disk's root), never relative
#   why:  one plain sentence, what the rule stops, as the preview prints it after "base: "
deny:
  # READ: files and folders that commonly hold keys, tokens or logins
  # SSH's keys
  - rule: "Read(~/.ssh/**)"                                              # this home
    why: "Agents cannot read ~/.ssh/, where SSH keeps private keys."   # the preview's sentence
  - rule: "Read(//mnt/c/Users/*/.ssh/**)"                                # the Windows home, from WSL
    why: "Agents in WSL cannot read the Windows home's .ssh/, where SSH keeps private keys."   # the preview's sentence
  - rule: "Read(//wsl.localhost/*/home/*/.ssh/**)"                       # WSL's home, from Windows
    why: "Agents on Windows cannot read WSL's ~/.ssh/ by its wsl.localhost path, where SSH keeps private keys."   # the preview's sentence
  - rule: "Read(//wsl$/*/home/*/.ssh/**)"                                # WSL's home, from Windows (wsl$)
    why: "Agents on Windows cannot read WSL's ~/.ssh/ by its wsl$ path, where SSH keeps private keys."   # the preview's sentence
