# Label definitions (bonsai.labels/1, contract §5.2): what each label in one namespace means.
# A made-up set: the example for bonsai.labels/1. labels.json holds what a reader returns for it.
#
# When to use: a pack ships one file like this per namespace; Bonsai's base pack ships the bonsai.* set.
# Fields of the file:
#   format     always bonsai.labels/1, the first key.
#   namespace  the namespace every label here belongs to, e.g. example.
#   version    this set's own version; it only grows (definitions are added, never redefined), e.g. 1.
#   labels     one entry per label, each with every field below (null or [] where it does not apply):
#     name         <namespace>.<name>, e.g. example.size.
#     kind         choice, text, number or list.
#     values       for choice: the allowed values, e.g. [small, large]; [] otherwise.
#     items        for list: text or number; null otherwise.
#     pattern      for text: a regular expression the value must match, or null.
#     max          for text: at most this many characters (up to 300), or null.
#     kinds        the document kinds that may carry it, e.g. [task, run].
#     set_by       agent (agents write it) or outside (only a program outside agent sessions does).
#     grants       true when the value grants a right (only bonsai.allows today); false otherwise.
#     description  one line, at most 200 characters: what agents see.
format: bonsai.labels/1
namespace: example  # the namespace every label here belongs to
version: 1  # this set's own version; it only grows
labels:  # one entry per label, each with every field below
  - name: example.size  # the label: <namespace>.<name>
    kind: choice  # the kind of value: choice, text, number or list
    values: [small, large]  # the allowed values for a choice; [] otherwise
    items:  # what a list holds, text or number; empty (null) otherwise
    pattern:  # a regular expression a text value must match; empty (null) when none
    max:  # the most characters a text value may have (up to 300); empty (null) when none
    kinds: [task]  # the document kinds that may carry it
    set_by: agent  # who writes it: agent, or outside (only a program outside agent sessions)
    grants: false  # true when the value grants a right (only bonsai.allows today)
    description: "How big the change is, as the planner judged it."  # one line, at most 200 characters: what agents see
  - name: example.ref  # the label: <namespace>.<name>
    kind: text  # the kind of value: choice, text, number or list
    values: []  # the allowed values for a choice; [] otherwise
    items:  # what a list holds, text or number; empty (null) otherwise
    pattern: "^[0-9a-f]{7,40}$"  # a regular expression a text value must match; empty (null) when none
    max: 60  # the most characters a text value may have (up to 300); empty (null) when none
    kinds: [task, run]  # the document kinds that may carry it
    set_by: outside  # who writes it: agent, or outside (only a program outside agent sessions)
    grants: false  # true when the value grants a right (only bonsai.allows today)
    description: "The commit an outside program recorded. Agents never write it."  # one line, at most 200 characters: what agents see
  - name: example.cost  # the label: <namespace>.<name>
    kind: number  # the kind of value: choice, text, number or list
    values: []  # the allowed values for a choice; [] otherwise
    items:  # what a list holds, text or number; empty (null) otherwise
    pattern:  # a regular expression a text value must match; empty (null) when none
    max:  # the most characters a text value may have (up to 300); empty (null) when none
    kinds: [task, run]  # the document kinds that may carry it
    set_by: outside  # who writes it: agent, or outside (only a program outside agent sessions)
    grants: false  # true when the value grants a right (only bonsai.allows today)
    description: "Dollars this work cost. Agents never write it."  # one line, at most 200 characters: what agents see
  - name: example.paths  # the label: <namespace>.<name>
    kind: list  # the kind of value: choice, text, number or list
    values: []  # the allowed values for a choice; [] otherwise
    items: text  # what a list holds, text or number; empty (null) otherwise
    pattern:  # a regular expression a text value must match; empty (null) when none
    max:  # the most characters a text value may have (up to 300); empty (null) when none
    kinds: [task]  # the document kinds that may carry it
    set_by: agent  # who writes it: agent, or outside (only a program outside agent sessions)
    grants: false  # true when the value grants a right (only bonsai.allows today)
    description: "Paths this task reads often, as globs. It grants nothing."  # one line, at most 200 characters: what agents see
