name: Release

# Build-only until spec step 5.7, which is Rohan's (design/plan.md, "CI and release after part 1"). A manual run
# builds every target in .goreleaser.yaml as a snapshot and publishes nothing: no tag trigger, no inputs, a read-only
# token and no secret, so the brews: block is never reached. The workflow also stays switched off on GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build with GoReleaser (snapshot, nothing published)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
