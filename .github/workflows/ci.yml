name: CI

on:
  pull_request:
  # Every branch, not only main: the orchestrator pushes a batch's branch and lands it only once every job here is green
  # on that commit (CLAUDE.md's landing rule). Only branches is named, so a tag push runs nothing here.
  push:
    branches: ['**']

# A newer push to a branch cancels the run it supersedes. On main the group is the commit, so no run there is ever
# cancelled or dropped from the queue: every commit main holds keeps its full result.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: the formats' schema-compare test (formats/compare_test.go) reads each schema at the set's base
      # commit with git show, and fails under CI when that commit is missing, as it is in a shallow clone.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      - name: Run tests
        run: go test -timeout 20m ./...

      - name: Run vet
        run: go vet ./...

      # The guard's test fault switch is compiled only with this tag (internal/guard/fault_on.go); a normal build
      # has none, which cmd/bonsai's TestNormalBuildHasNoFaultCode checks in the runs above.
      # The tagged steps here and in windows (fault tag) and lint run only the packages the tag can change (the tagged
      # files and every package that reaches them); the rest would repeat the plain pass. internal/selfcheck's
      # faulttag_test.go works the list out from go list and fails on any copy that differs, here or in bonsai.yaml.
      - name: Run tests with the fault tag
        run: go test -timeout 20m -tags bonsai_test_fault ./cmd/bonsai ./internal/guard ./internal/ladder ./internal/reference ./internal/reference/gen ./internal/rung0 ./internal/stopgate

      - name: Run vet with the fault tag
        run: go vet -tags bonsai_test_fault ./cmd/bonsai ./internal/guard ./internal/ladder ./internal/reference ./internal/reference/gen ./internal/rung0 ./internal/stopgate

      - name: Cross-compile (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build ./...

  # Its own job, not a matrix on test: a matrix would rename the check "test (ubuntu-latest)" (design/plan.md).
  # -timeout 20m in the Windows jobs: on windows-latest cmd/bonsai and internal/engine take about 10 minutes each, past
  # go test's default limit per package (step 5.4). The plain and the fault-tag passes are two jobs that run at once
  # (each took about 26 minutes in a row; T-5617): the plain pass keeps the name "windows" and holds the packs check,
  # which runs once for both; the tagged pass is "windows (fault tag)".
  windows:
    runs-on: windows-latest
    steps:
      # Full history, for the schema-compare test (as in test).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      - name: Run tests
        run: go test -timeout 20m ./...

      - name: Run vet
        run: go vet ./...

      # The packs' checks on Windows, as the packs job runs them on Linux: packs/template/ci/check.sh check (bonsai
      # check --pack, the README's rows, a scratch project linked to the pack at this commit, bonsai check there) on
      # each packs/*/ folder holding bonsai/pack.yaml. Git Bash runs the script, as each pack's own CI does on
      # Windows; claude plugin validate runs in the packs job only.
      - name: Check the packs
        shell: bash
        run: |
          CGO_ENABLED=0 go build -o bonsai.exe ./cmd/bonsai
          n=0
          for f in packs/*/bonsai/pack.yaml; do
            [ -f "$f" ] || continue
            d=${f%/bonsai/pack.yaml}
            sh packs/template/ci/check.sh check ./bonsai.exe "$d" . "$GITHUB_SHA" "$d" || exit 1
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "no pack folder under packs/"; exit 1; }

  # The windows job's second pass: the same tests and vet with the guard's test fault switch (see test), on a runner of
  # its own so the two passes run at once.
  windows-fault-tag:
    name: windows (fault tag)
    runs-on: windows-latest
    steps:
      # Full history, for the schema-compare test (as in test).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      - name: Run tests with the fault tag
        run: go test -timeout 20m -tags bonsai_test_fault ./cmd/bonsai ./internal/guard ./internal/ladder ./internal/reference ./internal/reference/gen ./internal/rung0 ./internal/stopgate

      - name: Run vet with the fault tag
        run: go vet -tags bonsai_test_fault ./cmd/bonsai ./internal/guard ./internal/ladder ./internal/reference ./internal/reference/gen ./internal/rung0 ./internal/stopgate

  # The packs in this repository, each packs/*/ folder holding bonsai/pack.yaml, checked by the pack template's own
  # script, packs/template/ci/check.sh, exactly as each pack's CI runs it (spec section 5, "The pack template"): bonsai
  # check --pack, the README's rows, a scratch project linked to the pack at this commit (the checkout as its source)
  # and bonsai check there, then claude plugin validate with the Claude Code the template's pack.yml pins (its
  # CLAUDE_CODE_VERSION, read from there, so the two never differ). A template whose fields and docs drift apart, or
  # a check Bonsai changed under the template, fails here. Validate runs with no secret: it needs no Claude login.
  packs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"

      - name: Install Claude Code
        run: |
          v=$(sed -n 's/^  CLAUDE_CODE_VERSION: "\([^"]*\)".*/\1/p' packs/template/.github/workflows/pack.yml)
          [ -n "$v" ] || { echo "no CLAUDE_CODE_VERSION in packs/template/.github/workflows/pack.yml"; exit 1; }
          npm install -g "@anthropic-ai/claude-code@$v"

      - name: Check the packs
        run: |
          CGO_ENABLED=0 go build -o bonsai ./cmd/bonsai
          n=0
          for f in packs/*/bonsai/pack.yaml; do
            [ -f "$f" ] || continue
            d=${f%/bonsai/pack.yaml}
            sh packs/template/ci/check.sh check ./bonsai "$d" . "$GITHUB_SHA" "$d" || exit 1
            sh packs/template/ci/check.sh validate "$d" || exit 1
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "no pack folder under packs/"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      # verify: false switches off the action's config check (golangci-lint config verify), which downloads a JSON
      # schema from golangci-lint's website on every run and failed CI twice on the network (8 and 9 Oct); the lint
      # itself still reads .golangci.yml and fails on a config it cannot read.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          verify: false

      # The same lint over the files the fault tag compiles in (internal/guard/fault_on.go and the tests beside it);
      # both steps are required.
      - name: golangci-lint with the fault tag
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          verify: false
          args: --build-tags=bonsai_test_fault ./cmd/bonsai ./internal/guard ./internal/ladder ./internal/reference ./internal/reference/gen ./internal/rung0 ./internal/stopgate

      # actionlint at an exact version through go run, so Go's checksum database checks what it fetches. It reads the
      # workflows here and the pack template's; internal/selfcheck/workflows_test.go holds their pins.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml packs/template/.github/workflows/*.yml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      # Pinned exactly, so a new release cannot change what CI checks on its own. v1.8.0 is the newest release; its go.mod
      # says go 1.26.0, which the go.mod toolchain (Go 1.27) satisfies. CI runs that toolchain with GOTOOLCHAIN=local.
      # Move the pin on purpose, when a newer release is wanted.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: govulncheck ./...

  # The release build rehearsed on every push (design/plan-5.md, 5.7.1): GoReleaser builds every release file as a
  # snapshot from this commit, the notes script reads CHANGELOG.md's newest section, and the dist checks
  # (internal/selfcheck/dist_test.go) hold the files to what a release must be. It publishes and uploads nothing, and
  # runs with the workflow's read-only token and no secret.
  release-check:
    runs-on: ubuntu-latest
    env:
      # GoReleaser by its module path at the version .goreleaser.yaml's header names, so Go's checksum database checks
      # it (the goreleaser action checks its download only against a checksums file from the same release page).
      GORELEASER: github.com/goreleaser/goreleaser/v2@v2.18.3
    steps:
      # Full history: GoReleaser reads the tags for the version.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      - name: Check .goreleaser.yaml
        run: go run "$GORELEASER" check

      # The current tag is set here, the newest v-tag before this commit: GoReleaser's open-source build would take a
      # packs' base-v tag on this commit for the version (.goreleaser.yaml's git section).
      - name: Build every release file as a snapshot
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          echo "current tag: $tag"
          GORELEASER_CURRENT_TAG=$tag go run "$GORELEASER" release --snapshot --clean

      # The newest section's notes, written outside the checkout, so a broken changelog shows on the push that broke it.
      - name: The notes for CHANGELOG.md's newest version
        run: |
          version=$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          [ -n "$version" ] || { echo "CHANGELOG.md has no ## [X.Y.Z] heading"; exit 1; }
          sh .github/scripts/release-notes.sh "v$version" "$RUNNER_TEMP/notes.md"
          echo "notes for v$version: $(wc -l < "$RUNNER_TEMP/notes.md") lines"

      - name: The dist checks
        run: BONSAI_CHECK_DIST="$GITHUB_WORKSPACE/dist" BONSAI_CHECK_COMMIT="$GITHUB_SHA" go test -count=1 -run TestDist -v ./internal/selfcheck/

  # The installers at their real places (design/plan-5.md, 5.6.6), on GitHub's throwaway machines only: no agent runs
  # either at a real place on a person's machine (spec section 3). ubuntu-latest's runner has passwordless sudo;
  # windows-latest's is an administrator, elevated with UAC off, so -ForceChild makes install.ps1 take its elevated
  # child's path (Start-Process -Verb RunAs) there, the code a person's install runs behind the prompt.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Print the Go version
        run: go version

      - name: Install, check, again while a copy runs, remove (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          go build -o dist/bonsai ./cmd/bonsai
          cp install/install.sh dist/
          want=$(sha256sum dist/bonsai | cut -d' ' -f1)
          # The runner's image leaves /usr/local/bin writable by a group or others, and install.sh rightly refuses a
          # target folder anyone but root can write (and, at the real place, one that is not root's). A person's
          # machine has it root's and writable by root alone; the runner is made so here, its state logged first.
          stat -c '/usr/local/bin before: %U:%G %A' /usr/local/bin
          sudo chown root:root /usr/local/bin
          sudo chmod go-w /usr/local/bin
          stat -c '/usr/local/bin now: %U:%G %A' /usr/local/bin
          sh dist/install.sh
          test "$(stat -c '%U %G %a' /usr/local/bin/bonsai)" = "root root 755"
          test "$(stat -c '%U' /usr/local/bin)" = root
          case "$(stat -c '%A' /usr/local/bin)" in ?????w????|????????w?) echo "/usr/local/bin is writable by others"; exit 1;; esac
          rec="$HOME/.bonsai/install.json"
          test "$(jq -r .path "$rec")" = /usr/local/bin/bonsai
          test "$(jq -r .sha256 "$rec")" = "$want"
          test "$(jq -r 'keys | join(",")' "$rec")" = "path,sha256,version"
          test "$(jq -r .version "$rec")" = "$(/usr/local/bin/bonsai --version | head -n1 | cut -d' ' -f2)"
          which -a bonsai
          test "$(env -i HOME="$HOME" PATH=/usr/local/bin:/usr/bin:/bin bash -lc 'command -v bonsai')" = /usr/local/bin/bonsai
          env -i HOME="$HOME" PATH=/usr/local/bin:/usr/bin:/bin bash -lc 'bonsai --version'
          cp "$rec" first.json
          sh dist/install.sh
          cmp "$rec" first.json
          (sleep 4 | CLAUDE_PROJECT_DIR="$PWD" /usr/local/bin/bonsai hook guard > guard.out 2>&1; echo $? > guard.rc) &
          sleep 1
          pgrep -f 'bonsai hook guard' > guard.pid
          sh dist/install.sh
          kill -0 "$(head -n1 guard.pid)"
          wait
          echo "the running copy ended with $(cat guard.rc): $(cat guard.out)"
          sh dist/install.sh --remove
          test ! -e /usr/local/bin/bonsai
          test ! -e "$rec"
          for left in /usr/local/bin/.bonsai.new.*; do
            if [ -e "$left" ]; then echo "left behind: $left"; exit 1; fi
          done

      - name: Install through the elevated child, check, again while a copy runs, a wrong hash, remove (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $place = 'C:\Program Files\Bonsai\bonsai.exe'
          $dir = 'C:\Program Files\Bonsai'
          $envKey = 'SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          function Get-RawPath { $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($envKey); try { [string]$k.GetValue('Path', '', 'DoNotExpandEnvironmentNames') } finally { $k.Close() } }
          function Get-PathKind { $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($envKey); try { $k.GetValueKind('Path') } finally { $k.Close() } }
          function Fail([string]$m) { Write-Host "FAIL: $m"; exit 1 }
          function Run-Install([string[]]$a) { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File dist\install.ps1 @a; if ($LASTEXITCODE -ne 0) { Fail "install.ps1 $a exit $LASTEXITCODE" } }
          New-Item -ItemType Directory dist | Out-Null
          go build -o dist\bonsai.exe .\cmd\bonsai
          if ($LASTEXITCODE -ne 0) { Fail 'build' }
          Copy-Item install\install.ps1 dist\
          $want = (Get-FileHash dist\bonsai.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $before = Get-RawPath
          if ($before -notmatch '%') { Write-Host 'note: the runner''s machine PATH holds no %...% entry' }
          Run-Install @('-ForceChild')
          if ((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant() -ne $want) { Fail 'installed hash' }
          $after = Get-RawPath
          if ((Get-PathKind) -ne 'ExpandString') { Fail 'the machine PATH is no longer ExpandString' }
          $entries = @($after -split ';' | Where-Object { $_ -ne '' })
          if (@($entries | Where-Object { $_.TrimEnd('\') -ieq $dir }).Count -ne 1) { Fail "the folder is not on the machine PATH once: $after" }
          $kept = @($before -split ';' | Where-Object { $_ -ne '' })
          if ((@($entries | Where-Object { $_.TrimEnd('\') -ine $dir }) -join ';') -cne ($kept -join ';')) { Fail "the other PATH entries changed: $before -> $after" }
          $bad = @('S-1-5-32-545', 'S-1-5-11', 'S-1-1-0')
          foreach ($a in (Get-Acl $dir).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])) {
            if ($a.AccessControlType -eq 'Allow' -and $bad -contains $a.IdentityReference.Value -and ($a.FileSystemRights -band 0x50000046) -ne 0 -and ($a.PropagationFlags -band 2) -eq 0) { Fail "the folder is writable by $($a.IdentityReference)" }
          }
          $rec = Join-Path $env:USERPROFILE '.bonsai\install.json'
          $r = Get-Content -Raw $rec | ConvertFrom-Json
          if ($r.path -cne 'C:/Program Files/Bonsai/bonsai.exe' -or $r.sha256 -cne $want -or -not $r.version) { Fail "install.json: $(Get-Content -Raw $rec)" }
          if ((@($r.PSObject.Properties.Name) | Sort-Object) -join ',' -cne 'path,sha256,version') { Fail 'install.json keys' }
          $fresh = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $found = & powershell.exe -NoProfile -Command "`$env:Path = '$($fresh -replace "'", "''")'; (Get-Command bonsai -All -CommandType Application | ForEach-Object Source) -join ';'; bonsai --version"
          Write-Host $found
          if (-not ($found[0] -split ';' -contains $place)) { Fail "Get-Command from a fresh shell: $found" }
          $first = Get-Content -Raw $rec
          Run-Install @('-ForceChild')
          if ((Get-Content -Raw $rec) -cne $first) { Fail 'a second install changed install.json' }
          $psi = New-Object Diagnostics.ProcessStartInfo $place, 'hook guard'
          $psi.UseShellExecute = $false; $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
          $psi.EnvironmentVariables['CLAUDE_PROJECT_DIR'] = (Get-Location).Path
          $p = [Diagnostics.Process]::Start($psi)
          Start-Sleep -Milliseconds 500
          Run-Install @('-ForceChild')
          if ($p.HasExited) { Fail 'the running copy ended during the install' }
          if (@(Get-ChildItem $dir -Filter 'bonsai.exe.old-*').Count -ne 1) { Fail 'the running copy was not set aside' }
          $p.StandardInput.Close(); $p.WaitForExit()
          Write-Host "the running copy ended with $($p.ExitCode)"
          Run-Install @('-ForceChild')
          # PowerShell's own -like, not -Filter: Windows' name matching lets 'bonsai.exe.*' match bonsai.exe itself.
          $left = @(Get-ChildItem -LiteralPath $dir | Where-Object { $_.Name -like 'bonsai.exe.*' })
          if ($left.Count -ne 0) {
            Get-ChildItem -LiteralPath $dir -Force | Format-Table Name, Length, LastWriteTime -AutoSize | Out-String | Write-Host
            Fail "the next install left the copy set aside: $(($left | ForEach-Object Name) -join ', ')"
          }
          $ast = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path dist\install.ps1).Path, [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] }, $false)) { . ([scriptblock]::Create($f.Extent.Text)) }
          $text = New-ChildText -Source (Resolve-Path dist\bonsai.exe).Path -Target $place -Hash ('0' * 64) -Real $true -Remove $false
          $code = Invoke-Child $text $true
          if ($code -ne 12) { Fail "the forced child with a wrong hash exited $code, not 12" }
          if (Test-Path "$place.new") { Fail 'the wrong-hash copy was left' }
          if ((Get-FileHash $place -Algorithm SHA256).Hash.ToLowerInvariant() -ne $want) { Fail 'the wrong-hash child changed the installed file' }
          Run-Install @('-Remove', '-ForceChild')
          if (Test-Path $dir) { Fail 'the folder is still there' }
          if (Test-Path $rec) { Fail 'install.json is still there' }
          $gone = Get-RawPath
          if ((@($gone -split ';' | Where-Object { $_ -ne '' }) -join ';') -cne ($kept -join ';')) { Fail "the PATH after remove: $gone" }
          Write-Host 'install.ps1 at its real place: installed, checked, again, again while running, wrong hash refused, removed'

      # The elevated cases beside the run above, each check run first against install.ps1 (it must pass) and then
      # against a copy of install.ps1 with one line broken, which it must catch (the job fails if a broken copy
      # passes). Each copy is made by one literal replace that must match exactly once, so a later edit of install.ps1
      # that moves the line fails here loudly, never passes quietly: that edit updates the copy's line here too.
      # - Nothing compiled: no new .cs, .dll or .tmp file in %TEMP% (each spelling of it, its top level) during an
      #   install, seen by a watcher while it runs and by a listing after it. Broken: the child compiles code (Add-Type).
      # - The machine PATH: still REG_EXPAND_SZ (broken: written as REG_SZ); its %...% entries kept as written, with a
      #   %SystemRoot% entry put in first so the check is never empty (broken: the PATH read expanded).
      # - A fresh process finds bonsai by the machine PATH alone: where.exe started with the environment Windows builds
      #   for a new logon from the registry (CreateEnvironmentBlock, system variables only). Broken: the PATH not set.
      # - No BONSAI_INSTALL_NOTICE left at the machine or user level. Broken: the notice set to a value.
      # - A Microsoft.PowerShell.Utility module of its own ahead on PSModulePath is never loaded by the elevated child
      #   (a marker line holding -EncodedCommand). Broken: the child calls one of its cmdlets.
      # - A pre-made C:\Program Files\Bonsai that Users can modify, then one where Users can only write attributes:
      #   install.ps1 exits 1 with the rights sentence, the child alone exits 18, and nothing is installed (no file, no
      #   PATH entry, no install.json). Broken: the write-attributes bit left out of the rights mask; the rights check
      #   always passing.
      # - A folder given as -Target (with and without a trailing backslash, and the real place's folder) refused with
      #   exit 1 and its sentence, nothing written beside it. Broken: the folder refusal taken out.
      # - An install and -Remove, at a scratch -Target and at the real place, leave no file, no PATH entry (machine or
      #   user) and no install.json. Broken: -Remove keeping install.json; -Remove keeping the PATH entry; -Remove keeping
      #   the file.
      - name: Elevated cases, each with a broken copy it must catch (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $place = 'C:\Program Files\Bonsai\bonsai.exe'
          $dir = 'C:\Program Files\Bonsai'
          $envKey = 'SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $rec = Join-Path $env:USERPROFILE '.bonsai\install.json'
          $good = Join-Path $root 'dist\install.ps1'
          $exe = Join-Path $root 'dist\bonsai.exe'
          $ci = Join-Path $root 'elevated'
          $found = New-Object 'System.Collections.Generic.List[string]'
          function Fail([string]$m) { Write-Host "FAIL: $m"; exit 1 }
          function Add-Finding([string]$m) { $found.Add($m) }
          function Get-RawPath { $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($envKey); try { [string]$k.GetValue('Path', '', 'DoNotExpandEnvironmentNames') } finally { $k.Close() } }
          function Get-PathKind { $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($envKey); try { [string]$k.GetValueKind('Path') } finally { $k.Close() } }
          function Set-RawPath([string]$v) { $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($envKey, $true); try { $k.SetValue('Path', $v, [Microsoft.Win32.RegistryValueKind]::ExpandString) } finally { $k.Close() } }
          function Get-Others([string]$v) { (@($v -split ';' | Where-Object { $_ -ne '' -and $_.TrimEnd('\') -ine $dir })) -join ';' }
          function Test-OnPath([string]$v) { @($v -split ';' | Where-Object { $_.TrimEnd('\') -ieq $dir }).Count -gt 0 }
          function Get-Listing([string]$p) { (@([IO.Directory]::GetFileSystemEntries($p)) | Sort-Object) -join '|' }
          function Reset-Machine {
            foreach ($p in @($dir, $rec)) { if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force } }
            Set-RawPath $base
            $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($envKey, $true); try { $k.DeleteValue('BONSAI_INSTALL_NOTICE', $false) } finally { $k.Close() }
          }
          function Invoke-Install([string]$script, [string[]]$a) {
            $eap = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
            try { $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script @a 2>&1 } finally { $ErrorActionPreference = $eap }
            $code = $LASTEXITCODE
            $text = (@($out) | ForEach-Object { [string]$_ }) -join "`n"
            Write-Host "  $(Split-Path -Leaf (Split-Path $script)) install.ps1 $a -> exit $code"
            return New-Object PSObject -Property @{ Code = $code; Text = $text; TempNew = @() }
          }
          # A broken copy: install.ps1 with one literal replaced, the line asserted to be there exactly once.
          $source = [IO.File]::ReadAllText($good)
          function New-Broken([string]$name, [string]$old, [string]$new) {
            $n = ([regex]::Matches($source, [regex]::Escape($old))).Count
            if ($n -ne 1) { Fail "broken copy ${name}: the text it replaces is in install.ps1 $n times, not once: $old" }
            $d = Join-Path $ci "broken\$name"
            [void][IO.Directory]::CreateDirectory($d)
            Copy-Item -LiteralPath $exe -Destination $d
            $p = Join-Path $d 'install.ps1'
            [IO.File]::WriteAllText($p, $source.Replace($old, $new), (New-Object Text.UTF8Encoding $false))
            return $p
          }
          function Assert-Clean([string]$what) {
            if ($found.Count -ne 0) { Fail "${what}: $($found -join ' | ')" }
            Write-Host "${what}: passed"
          }
          function Assert-Caught([string]$name, [string]$tag) {
            $hits = @($found | Where-Object { $_.StartsWith("${tag}:") })
            if ($hits.Count -eq 0) { Fail "broken copy ${name} passed the ${tag} check, so that check catches nothing (all findings: $($found -join ' | '))" }
            Write-Host "broken copy ${name} caught: $($hits -join ' | ')"
            $found.Clear()
          }

          if (-not (Test-Path -LiteralPath $good) -or -not (Test-Path -LiteralPath $exe)) { Fail 'dist\install.ps1 or dist\bonsai.exe is missing (the step above makes them)' }
          if (Test-Path -LiteralPath $dir) { Fail 'C:\Program Files\Bonsai is there before these cases (the step above removes it)' }
          $want = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $orig = Get-RawPath
          $base = $orig.TrimEnd(';') + ';%SystemRoot%\bonsai-ci-probe'
          $userPath = [string][Environment]::GetEnvironmentVariable('Path', 'User')
          $psModulePath = $env:PSModulePath
          $stubRoot = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'WindowsPowerShell\Modules\Microsoft.PowerShell.Utility'
          if (Test-Path -LiteralPath $stubRoot) { Fail "$stubRoot is there before these cases" }
          [void][IO.Directory]::CreateDirectory((Join-Path $ci 'scratch'))
          [void][IO.Directory]::CreateDirectory((Join-Path $ci 'folder'))

          # The environment Windows gives a new logon, from the registry: system variables only (no token).
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class BonsaiCiLogonEnv {
              [DllImport("userenv.dll", SetLastError = true)]
              static extern bool CreateEnvironmentBlock(out IntPtr block, IntPtr token, bool inherit);
              [DllImport("userenv.dll", SetLastError = true)]
              static extern bool DestroyEnvironmentBlock(IntPtr block);
              public static string[] Machine() {
                  IntPtr block;
                  if (!CreateEnvironmentBlock(out block, IntPtr.Zero, false)) { throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error()); }
                  try {
                      List<string> all = new List<string>();
                      IntPtr p = block;
                      while (true) {
                          string s = Marshal.PtrToStringUni(p);
                          if (String.IsNullOrEmpty(s)) { break; }
                          all.Add(s);
                          p = new IntPtr(p.ToInt64() + (s.Length + 1) * 2);
                      }
                      return all.ToArray();
                  } finally { DestroyEnvironmentBlock(block); }
              }
          }
          '@
          function Get-FreshWhere {
            $psi = New-Object Diagnostics.ProcessStartInfo (Join-Path ([Environment]::SystemDirectory) 'where.exe'), 'bonsai'
            $psi.UseShellExecute = $false; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
            $psi.WorkingDirectory = [Environment]::SystemDirectory
            $psi.EnvironmentVariables.Clear()
            foreach ($kv in [BonsaiCiLogonEnv]::Machine()) { $i = $kv.IndexOf('='); if ($i -gt 0) { $psi.EnvironmentVariables[$kv.Substring(0, $i)] = $kv.Substring($i + 1) } }
            $p = [Diagnostics.Process]::Start($psi)
            $o = $p.StandardOutput.ReadToEnd(); [void]$p.StandardError.ReadToEnd(); $p.WaitForExit()
            return @($o -split "`r?`n" | Where-Object { $_ -ne '' })
          }

          # Every spelling of the temporary folder the install or its child may use; only their top level is read.
          $temps = @()
          foreach ($t in @([IO.Path]::GetTempPath(), $env:TEMP, $env:TMP, [Environment]::GetEnvironmentVariable('TEMP', 'User'), (Join-Path $env:LOCALAPPDATA 'Temp'))) {
            if (-not $t) { continue }
            $f = [IO.Path]::GetFullPath($t).TrimEnd('\')
            if ([IO.Directory]::Exists($f) -and @($temps | Where-Object { $_ -ieq $f }).Count -eq 0) { $temps += $f }
          }
          Write-Host "watching: $($temps -join ', ')"
          $tempRx = '\.(cs|dll|tmp)$'
          function Get-TempNames { $n = @{}; foreach ($t in $temps) { foreach ($f in [IO.Directory]::GetFiles($t)) { if ($f -match $tempRx) { $n[$f.ToLowerInvariant()] = $true } } }; return $n }
          # An install with a watcher on each temporary folder for its whole run: the .cs, .dll and .tmp files created
          # or renamed into it while the install ran, and those new in a listing after it, made since it started.
          function Invoke-Watched([string]$script, [string[]]$a) {
            $pre = Get-TempNames
            $start = [DateTime]::UtcNow
            $ws = @()
            for ($i = 0; $i -lt $temps.Count; $i++) {
              $w = [IO.FileSystemWatcher]::new($temps[$i])
              $w.IncludeSubdirectories = $false
              $w.InternalBufferSize = 65536
              $null = Register-ObjectEvent -InputObject $w -EventName Created -SourceIdentifier "bonsai-temp-c$i"
              $null = Register-ObjectEvent -InputObject $w -EventName Renamed -SourceIdentifier "bonsai-temp-r$i"
              $w.EnableRaisingEvents = $true
              $ws += $w
            }
            try { $r = Invoke-Install $script $a } finally {
              Start-Sleep -Milliseconds 500
              foreach ($w in $ws) { $w.EnableRaisingEvents = $false }
            }
            $new = @()
            for ($i = 0; $i -lt $ws.Count; $i++) {
              foreach ($sid in @("bonsai-temp-c$i", "bonsai-temp-r$i")) {
                foreach ($e in @(Get-Event -SourceIdentifier $sid -ErrorAction SilentlyContinue)) {
                  $p = [string]$e.SourceEventArgs.FullPath
                  if ($p -match $tempRx) { $new += $p }
                  Remove-Event -EventIdentifier $e.EventIdentifier
                }
                Unregister-Event -SourceIdentifier $sid
              }
              $ws[$i].Dispose()
            }
            $post = Get-TempNames
            foreach ($k in $post.Keys) {
              if ($pre.ContainsKey($k)) { continue }
              try { if ([IO.File]::GetCreationTimeUtc($k) -ge $start.AddSeconds(-1)) { $new += $k } } catch { }  # gone again meanwhile
            }
            $r.TempNew = @($new | Sort-Object -Unique)
            return $r
          }

          # Nothing compiled, the machine PATH, a fresh process, no notice left.
          function Test-Install([string]$script) {
            Reset-Machine
            $r = Invoke-Watched $script @('-ForceChild')
            if ($r.Code -ne 0) { Add-Finding "setup: install exit $($r.Code): $($r.Text)" }
            if ($r.TempNew.Count -ne 0) { Add-Finding "temp: made in %TEMP% during the install: $($r.TempNew -join ', ')" }
            if ((Get-PathKind) -ne 'ExpandString') { Add-Finding "kind: the machine PATH is $(Get-PathKind), not ExpandString" }
            $raw = Get-RawPath
            if ((Get-Others $raw) -cne (Get-Others $base)) { Add-Finding "kept: the other machine PATH entries changed: $base -> $raw" }
            $where = @(Get-FreshWhere)
            if ($where.Count -eq 0 -or $where[0] -ine $place) { Add-Finding "fresh: where.exe bonsai in a new logon's environment found: $($where -join ', ')" }
            $k = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($envKey); try { $m = $k.GetValue('BONSAI_INSTALL_NOTICE') } finally { $k.Close() }
            $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment'); try { $u = $k.GetValue('BONSAI_INSTALL_NOTICE') } finally { $k.Close() }
            if ($null -ne $m -or $null -ne $u) { Add-Finding "notice: BONSAI_INSTALL_NOTICE is left: machine '$m', user '$u'" }
          }
          # A Utility module of its own, first on PSModulePath, writes a marker line when it loads or runs.
          $marker = Join-Path $ci 'stub-marker.txt'
          function Test-Stub([string]$script) {
            Reset-Machine
            if (Test-Path -LiteralPath $marker) { Remove-Item -LiteralPath $marker -Force }
            $r = Invoke-Install $script @('-ForceChild')
            if ($r.Code -ne 0) { Add-Finding "setup: install exit $($r.Code): $($r.Text)" }
            $lines = @()
            if (Test-Path -LiteralPath $marker) { $lines = @([IO.File]::ReadAllLines($marker)) }
            Write-Host "  the stub's marker: $($lines.Count) line(s)"
            $child = @($lines | Where-Object { $_ -match '-EncodedCommand' })
            if ($child.Count -ne 0) { Add-Finding "stub: the elevated child loaded the stub module: $($child[0].Substring(0, [Math]::Min(160, $child[0].Length)))" }
          }
          # A pre-made folder Users can write: install.ps1 exits 1 with its sentence, the child alone 18, nothing installed.
          function Test-Loose([string]$script, [string]$grant) {
            Reset-Machine
            [void][IO.Directory]::CreateDirectory($dir)
            & icacls.exe $dir /grant "*S-1-5-32-545:$grant" | Out-Host
            if ($LASTEXITCODE -ne 0) { Fail "icacls $grant exit $LASTEXITCODE" }
            $r = Invoke-Install $script @('-ForceChild')
            if ($r.Code -ne 1) { Add-Finding "refused: install.ps1 exit $($r.Code), not 1 ($grant)" }
            if (-not $r.Text.Contains('install.ps1: the install stopped at checking the folder''s rights') -or -not $r.Text.Contains('next: ')) { Add-Finding "refused: not the rights sentence ($grant): $($r.Text)" }
            $ast = [Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$null)
            foreach ($fn in $ast.FindAll({ param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] }, $false)) { . ([scriptblock]::Create($fn.Extent.Text)) }
            $text = New-ChildText -Source (Join-Path (Split-Path $script) 'bonsai.exe') -Target $place -Hash $want -Real $true -Remove $false
            $code = Invoke-Child $text $true
            Write-Host "  the child alone ($grant) -> exit $code"
            if ($code -ne 18) { Add-Finding "refused: the child alone exit $code, not 18 ($grant)" }
            $left = Get-Listing $dir
            if ($left -ne '') { Add-Finding "refused: the folder holds $left ($grant)" }
            if (Test-OnPath (Get-RawPath)) { Add-Finding "refused: the folder is on the machine PATH ($grant)" }
            if (Test-Path -LiteralPath $rec) { Add-Finding "refused: install.json was written ($grant)" }
          }
          # A folder as -Target: exit 1 with its sentence, nothing written in it or beside it, no record.
          function Test-FolderTarget([string]$script, [string]$target) {
            $folder = $target.TrimEnd('\')
            $parent = Split-Path $folder
            $in = Get-Listing $folder; $beside = Get-Listing $parent
            $r = Invoke-Install $script @('-Target', $target)
            if ($r.Code -ne 1) { Add-Finding "folder: exit $($r.Code), not 1 ($target)" }
            if (-not $r.Text.Contains("install.ps1: the target $target is a folder, not a file's path") -or -not $r.Text.Contains('next: ')) { Add-Finding "folder: not the folder sentence ($target): $($r.Text)" }
            if ((Get-Listing $folder) -cne $in -or (Get-Listing $parent) -cne $beside) { Add-Finding "folder: something was written in or beside $folder" }
            if (Test-Path -LiteralPath $rec) { Add-Finding "folder: install.json was written ($target)" }
          }
          # An install and -Remove leave no file, no PATH entry and no record.
          function Test-Remove([string]$script, [bool]$real) {
            Reset-Machine
            if ($real) { $a = @('-ForceChild'); $t = $place } else { $t = Join-Path $ci 'scratch\bonsai.exe'; $a = @('-Target', $t) }
            $r = Invoke-Install $script $a
            if ($r.Code -ne 0 -or -not (Test-Path -LiteralPath $t) -or -not (Test-Path -LiteralPath $rec)) { Add-Finding "setup: install exit $($r.Code): $($r.Text)" }
            $r = Invoke-Install $script ($a + '-Remove')
            if ($r.Code -ne 0) { Add-Finding "remove: -Remove exit $($r.Code): $($r.Text)" }
            if ($real) { if (Test-Path -LiteralPath $dir) { Add-Finding "remove: the folder is left: $(Get-Listing $dir)" } } elseif ((Get-Listing (Split-Path $t)) -ne '') { Add-Finding "remove: left: $(Get-Listing (Split-Path $t))" }
            $raw = Get-RawPath
            if ((Get-Others $raw) -cne (Get-Others $base) -or (Test-OnPath $raw)) { Add-Finding "remove: the machine PATH is not as before: $raw" }
            if ([string][Environment]::GetEnvironmentVariable('Path', 'User') -cne $userPath) { Add-Finding 'remove: the user PATH changed' }
            if (Test-Path -LiteralPath $rec) { Add-Finding 'remove: install.json is left' }
          }

          try {
            Set-RawPath $base
            Write-Host "the machine PATH, with a %SystemRoot% entry put in: $base"

            Test-Install $good; Assert-Clean 'an install: nothing compiled, the PATH kind and entries, a fresh process, no notice'
            Test-Install (New-Broken 'compiles' '    [Environment]::SetEnvironmentVariable(''BONSAI_INSTALL_NOTICE'', [NullString]::Value, [EnvironmentVariableTarget]::Machine)' '    Add-Type -Namespace BonsaiCiBroken -Name Native -MemberDefinition ''[DllImport("user32.dll")] public static extern IntPtr GetDesktopWindow();'''); Assert-Caught 'compiles' 'temp'
            Test-Install (New-Broken 'path-sz' '[Microsoft.Win32.RegistryValueKind]::ExpandString' '[Microsoft.Win32.RegistryValueKind]::String'); Assert-Caught 'path-sz' 'kind'
            Test-Install (New-Broken 'path-expanded' '[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames' '[Microsoft.Win32.RegistryValueOptions]::None'); Assert-Caught 'path-expanded' 'kept'
            Test-Install (New-Broken 'path-unset' 'Set-MachinePath $false' '$null = $false'); Assert-Caught 'path-unset' 'fresh'
            Test-Install (New-Broken 'notice-left' '[NullString]::Value, [EnvironmentVariableTarget]::Machine' '''1'', [EnvironmentVariableTarget]::Machine'); Assert-Caught 'notice-left' 'notice'

            [void][IO.Directory]::CreateDirectory((Join-Path $stubRoot '9.9.9'))
            [IO.File]::WriteAllText((Join-Path $stubRoot '9.9.9\Microsoft.PowerShell.Utility.psd1'), "@{ ModuleVersion = '9.9.9'; RootModule = 'Microsoft.PowerShell.Utility.psm1'; FunctionsToExport = @('Get-FileHash'); CmdletsToExport = @(); AliasesToExport = @() }`r`n")
            [IO.File]::WriteAllText((Join-Path $stubRoot '9.9.9\Microsoft.PowerShell.Utility.psm1'), "[IO.File]::AppendAllText('$marker', 'loaded ' + [Environment]::CommandLine + [Environment]::NewLine)`r`nfunction Get-FileHash { [IO.File]::AppendAllText('$marker', 'Get-FileHash ' + [Environment]::CommandLine + [Environment]::NewLine) }`r`nExport-ModuleMember -Function Get-FileHash`r`n")
            $env:PSModulePath = (Split-Path $stubRoot) + ';' + $psModulePath
            Test-Stub $good; Assert-Clean 'a Utility module of its own ahead on PSModulePath: not loaded by the child'
            Test-Stub (New-Broken 'child-cmdlet' '$step = 12' '$step = 12; $null = Get-FileHash -LiteralPath $new'); Assert-Caught 'child-cmdlet' 'stub'
            $env:PSModulePath = $psModulePath
            Remove-Item -LiteralPath $stubRoot -Recurse -Force

            Test-Loose $good '(OI)(CI)M'; Assert-Clean 'a pre-made folder Users can modify: refused, exit 1 and 18, nothing installed'
            Test-Loose $good '(WA)'; Assert-Clean 'a pre-made folder Users can write attributes of: refused, exit 1 and 18, nothing installed'
            Test-Loose (New-Broken 'mask-no-wa' '0x40 -bor 0x100 -bor 0x10000' '0x40 -bor 0x10000') '(WA)'; Assert-Caught 'mask-no-wa' 'refused'
            Test-Loose (New-Broken 'rights-pass' 'function Test-Rights([string]$p) {' 'function Test-Rights([string]$p) { return $false') '(OI)(CI)M'; Assert-Caught 'rights-pass' 'refused'

            Reset-Machine
            $folder = Join-Path $ci 'folder'
            Test-FolderTarget $good $folder
            Test-FolderTarget $good ($folder + '\')
            [void][IO.Directory]::CreateDirectory($dir)
            Test-FolderTarget $good $dir
            Assert-Clean 'a folder as -Target: refused, exit 1, nothing written'
            Reset-Machine
            Test-FolderTarget (New-Broken 'folder-taken' 'if ([IO.Directory]::Exists($Target)) {' 'if ($false) {') $folder; Assert-Caught 'folder-taken' 'folder'
            # PowerShell's own -like, not -Filter: Windows' name matching lets 'folder.*' match the folder itself.
            Get-ChildItem -LiteralPath $ci | Where-Object { $_.Name -like 'folder.*' } | Remove-Item -Force

            Test-Remove $good $false; Test-Remove $good $true; Assert-Clean 'an install and -Remove, scratch and real: no file, no PATH entry, no record'
            Test-Remove (New-Broken 'record-kept' 'if ([IO.File]::Exists($record)) { [IO.File]::Delete($record) }' '$null = $record') $false; Assert-Caught 'record-kept' 'remove'
            Test-Remove (New-Broken 'path-kept' 'Set-MachinePath $true' '$null = $true') $true; Assert-Caught 'path-kept' 'remove'
            Test-Remove (New-Broken 'file-kept' '{ Remove-Busy $f }' '{ }') $false; Assert-Caught 'file-kept' 'remove'
          } finally {
            $env:PSModulePath = $psModulePath
            try { if (Test-Path -LiteralPath $stubRoot) { Remove-Item -LiteralPath $stubRoot -Recurse -Force } } catch { Write-Host "cleanup: $_" }
            try { Reset-Machine; Set-RawPath $orig } catch { Write-Host "cleanup: $_" }
          }
          Write-Host 'the elevated cases: each passed, and each broken copy was caught'
          exit 0
