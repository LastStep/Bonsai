# tmux.conf: the split screen the Claude Code clips are filmed in (clips/layout.sh uses it, on its own tmux socket, so
# the person's own tmux is never touched). No status bar, a thin border, no prefix keys: the tapes move between panes
# with Alt+a (Claude Code), Alt+s (the live view) and Alt+d (the person's shell, in the ask clip only).
set -g status off
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour240
set -g default-command "bash --norc"
bind -n M-a select-pane -t 0
bind -n M-s select-pane -t 1
bind -n M-d select-pane -t 2
