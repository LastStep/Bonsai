<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="t d">
  <title id="t">How Bonsai works</title>
  <desc id="d">A Claude Code agent's edits and shell commands go to the guard, which allows each one or refuses it with why, the next step and the rule. The agent proves its work with the ladder, which climbs the task's rungs: red, and the stop gate holds the session; green, and the work is done. Every decision and every climb is written to the log in .bonsai/local/.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#6e7781"/>
    </marker>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">

    <!-- the agent -->
    <rect x="20" y="40" width="180" height="400" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="110" y="70" text-anchor="middle" font-size="18" font-weight="600">Claude Code</text>
    <text x="110" y="88" text-anchor="middle" fill="#59636e">an agent's session</text>
    <rect x="34" y="96" width="152" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="110" y="115" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">Edit bonsai.yaml</text>
    <text x="110" y="238" text-anchor="middle" fill="#59636e">working on task T-0001,</text>
    <text x="110" y="256" text-anchor="middle" fill="#59636e">started with</text>
    <text x="110" y="276" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">BONSAI_TASK=T-0001</text>
    <rect x="34" y="358" width="152" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="110" y="376" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">bonsai ladder</text>
    <text x="110" y="393" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">--task T-0001</text>

    <!-- arrows from the agent -->
    <g stroke="#6e7781" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <path d="M200 110 H258"/>
      <path d="M200 380 H258"/>
    </g>
    <text x="229" y="100" text-anchor="middle" font-size="12" fill="#59636e">each call</text>
    <text x="229" y="370" text-anchor="middle" font-size="12" fill="#59636e">the climb</text>

    <!-- the guard -->
    <rect x="260" y="70" width="150" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="335" y="100" text-anchor="middle" font-size="18" font-weight="600">guard</text>
    <text x="335" y="120" text-anchor="middle" font-size="12" fill="#59636e">judges every edit</text>
    <text x="335" y="136" text-anchor="middle" font-size="12" fill="#59636e">and shell command</text>

    <g stroke="#6e7781" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <path d="M410 100 C 440 100, 440 94, 468 94"/>
      <path d="M410 122 C 440 122, 440 174, 468 174"/>
      <path d="M335 150 V248"/>
    </g>
    <text x="345" y="205" font-size="12" fill="#59636e">every decision</text>

    <!-- allowed -->
    <rect x="470" y="76" width="330" height="36" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <path d="M484 95 L490 101 L500 88" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="99" font-size="14"><tspan font-weight="600" fill="#1a7f37">allowed</tspan><tspan dx="10">the call runs</tspan></text>

    <!-- refused -->
    <rect x="470" y="126" width="330" height="96" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <path d="M485 141 L497 153 M497 141 L485 153" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="510" y="152" font-size="14"><tspan font-weight="600" fill="#cf222e">refused</tspan><tspan dx="10" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">Edit bonsai.yaml</tspan></text>
    <g font-size="12">
      <text x="486" y="174" fill="#59636e">why</text>
      <text x="556" y="174">only a person changes it</text>
      <text x="486" y="192" fill="#59636e">next step</text>
      <text x="556" y="192">ask the person</text>
      <text x="486" y="210" fill="#59636e">rule</text>
      <text x="556" y="210" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">person-only</text>
    </g>

    <!-- the log -->
    <rect x="260" y="250" width="540" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="284" y="284" font-size="18" font-weight="600">log</text>
    <text x="332" y="283" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">.bonsai/local/</text>
    <text x="470" y="283" fill="#59636e">every decision and every climb, in order</text>

    <!-- the ladder -->
    <rect x="260" y="330" width="150" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="335" y="360" text-anchor="middle" font-size="18" font-weight="600">ladder</text>
    <text x="335" y="380" text-anchor="middle" font-size="12" fill="#59636e">climbs the task's rungs:</text>
    <text x="335" y="396" text-anchor="middle" font-size="12" fill="#59636e">the tests and checks</text>
    <text x="335" y="412" text-anchor="middle" font-size="12" fill="#59636e">bonsai.yaml names</text>

    <g stroke="#6e7781" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <path d="M410 370 C 440 370, 440 348, 468 348"/>
      <path d="M410 392 C 440 392, 440 410, 468 410"/>
      <path d="M335 330 V308"/>
    </g>
    <text x="345" y="322" font-size="12" fill="#59636e">every climb</text>

    <!-- green -->
    <rect x="470" y="330" width="330" height="36" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <path d="M484 349 L490 355 L500 342" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="353" font-size="14"><tspan font-weight="600" fill="#1a7f37">green</tspan><tspan dx="10">done: the work is proved</tspan></text>

    <!-- red -->
    <rect x="470" y="380" width="330" height="60" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <path d="M485 396 L497 408 M497 396 L485 408" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="510" y="406" font-size="14"><tspan font-weight="600" fill="#cf222e">red</tspan><tspan dx="10">the stop gate holds the session</tspan></text>
    <text x="510" y="426" font-size="12" fill="#59636e">until a climb is green: fix the work, climb again</text>
  </g>
</svg>
